# Render Blueprint for the Bezra backend (Python FastAPI). Render reads this file when you choose
# "New > Blueprint" and pick this GitHub repository. Secrets are typed in Render's dashboard, never here.
services:
  - type: web
    name: bezra-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -u seed.py && python -u -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      # The website's address on Vercel, e.g. https://bezra.vercel.app (comma-separate several)
      - key: BEZRA_ORIGINS
        sync: false
      # Fixed passwords for the seeded accounts (the free plan's database is rebuilt on every restart)
      - key: ENGINEER_PASSWORD
        sync: false
      - key: DEMO_FARMER_PASSWORD
        sync: false
      - key: DEMO_MODE
        value: "1"
      - key: BEZRA_SECURE_COOKIES
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EARTHDATA_USERNAME
        sync: false
      - key: EARTHDATA_PASSWORD
        sync: false
      # Phase 3: Supabase Postgres (session pooler URL). Without it the free plan's SQLite is wiped on restart.
      - key: DATABASE_URL
        sync: false
      # Phase 3: shared secret for POST /jobs/refresh (same value as the GitHub repository secret JOBS_TOKEN)
      - key: JOBS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
